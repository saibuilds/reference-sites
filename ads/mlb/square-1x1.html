<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080, initial-scale=1">
<title>MyLegalBasement — Square 1:1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0805;
    --surface:#1A1108;
    --copper:#C97844;
    --ember:#E89B6A;
    --moss:#84A07C;
    --moss-deep:#5C7A55;
    --cream:#F2E8D8;
    --muted:#9B8C7B;
    --gold:#D4AF37;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;overflow:hidden;background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  body{position:relative}

  .haze{
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 18% 28%, rgba(232,155,106,0.14), transparent 45%),
      radial-gradient(circle at 82% 72%, rgba(132,160,124,0.12), transparent 50%),
      radial-gradient(circle at 50% 120%, rgba(232,155,106,0.08), transparent 60%);
    opacity:0;
    animation: hazeIn 0.5s ease forwards, hazeDrift 35s ease-in-out 0.5s infinite;
  }
  @keyframes hazeIn{to{opacity:1}}
  @keyframes hazeDrift{
    0%,100%{background-position:0% 0%, 0% 0%, 0% 0%; transform:scale(1)}
    50%{background-position:5% 8%, -4% -6%, 3% -5%; transform:scale(1.04)}
  }

  .grain{
    position:absolute;inset:0;pointer-events:none;opacity:0.06;mix-blend-mode:overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
  }

  .particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .particles span{
    position:absolute;width:5px;height:5px;border-radius:50%;
    bottom:-20px;animation: rise linear infinite;
  }
  .particles span.c{background:radial-gradient(circle, rgba(232,155,106,0.7), transparent 70%)}
  .particles span.m{background:radial-gradient(circle, rgba(132,160,124,0.65), transparent 70%)}
  @keyframes rise{
    0%{transform:translateY(0) translateX(0);opacity:0}
    10%{opacity:0.7}
    100%{transform:translateY(-1200px) translateX(30px);opacity:0}
  }

  .stage{
    position:relative;width:100%;height:100%;
    display:grid;
    grid-template-columns: 420px 1fr;
    grid-template-rows: 1fr 130px;
    gap:36px;
    padding:70px 70px 0;
    animation: loop 9s linear infinite;
  }
  @keyframes loop{0%,100%{opacity:1}}

  .left{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .right{display:flex;flex-direction:column;justify-content:center}

  .logo-wrap{
    width:340px;height:340px;
    display:flex;align-items:center;justify-content:center;
    filter: drop-shadow(0 8px 30px rgba(201,120,68,0.25));
  }
  .logo-wrap svg{width:100%;height:100%}

  .draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 0.9s ease forwards;opacity:0}
  .fillIn{opacity:0;animation:fillIn 0.6s ease forwards}
  .key{opacity:0;transform-origin:138px 133px;animation:keyIn 0.4s ease forwards, keyDing 0.3s ease 0.4s forwards}
  @keyframes draw{0%{opacity:1;stroke-dashoffset:600}100%{opacity:1;stroke-dashoffset:0}}
  @keyframes fillIn{to{opacity:1}}
  @keyframes keyIn{0%{opacity:0;transform:scale(0.6)}100%{opacity:1;transform:scale(1)}}
  @keyframes keyDing{
    0%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(212,175,55,0))}
    50%{transform:scale(1.25);filter:drop-shadow(0 0 14px rgba(212,175,55,0.85))}
    100%{transform:scale(1);filter:drop-shadow(0 0 4px rgba(212,175,55,0.3))}
  }
  .p1{animation-delay:0.50s}.p2{animation-delay:0.78s}.p3{animation-delay:1.06s}.p4{animation-delay:1.34s}
  .p5{animation-delay:1.62s}.p6{animation-delay:1.90s}.p7{animation-delay:2.18s}

  .brand{
    margin-top:18px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;letter-spacing:0.36em;text-transform:uppercase;color:var(--muted);
    opacity:0;animation:fade 0.6s ease 2.4s forwards;
    text-align:center;
  }
  @keyframes fade{to{opacity:1}}

  .tagline{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-weight:500;
    font-size:84px;line-height:1.05;color:var(--cream);
  }
  .tagline em.c{color:var(--copper);font-style:italic;font-weight:600}
  .tagline em.m{color:var(--moss);font-style:italic;font-weight:600}
  .tagline .w{display:inline-block;opacity:0;transform:translateY(20px);animation:wordIn 0.5s ease forwards}
  .tagline .w1{animation-delay:2.55s}.tagline .w2{animation-delay:2.75s}
  .tagline .w3{animation-delay:3.05s}.tagline .w4{animation-delay:3.25s}
  @keyframes wordIn{to{opacity:1;transform:translateY(0)}}

  .stats{
    margin-top:32px;
    display:flex;gap:24px;
    opacity:0;transform:translateY(28px);
    animation: slideUp 0.7s ease 3.85s forwards;
  }
  @keyframes slideUp{to{opacity:1;transform:translateY(0)}}
  .stat{flex:1}
  .stat .num{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:42px;color:var(--ember);font-weight:600;
  }
  .stat.s4 .num{color:var(--gold)}
  .stat .lbl{
    margin-top:4px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:0.36em;text-transform:uppercase;color:var(--muted);
  }

  .split{
    margin-top:30px;display:flex;gap:16px;
  }
  .pill{
    flex:1;padding:18px 14px;border-radius:12px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:rgba(255,255,255,0.02);
    opacity:0;transform:translateY(20px);
  }
  .pill .label{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.3em;text-transform:uppercase}
  .pill .wk{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:30px}
  .pill.copper{border:1px solid rgba(201,120,68,0.45); box-shadow: inset 0 0 22px rgba(201,120,68,0.15);}
  .pill.copper .label,.pill.copper .wk{color:var(--copper)}
  .pill.moss{border:1px solid rgba(132,160,124,0.45); box-shadow: inset 0 0 22px rgba(132,160,124,0.15);}
  .pill.moss .label,.pill.moss .wk{color:var(--moss)}
  .pill.copper{animation: slideUp 0.6s ease 5.2s forwards}
  .pill.moss{animation: slideUp 0.6s ease 5.45s forwards}

  .bar{
    margin-top:18px;height:3px;width:100%;background:rgba(201,120,68,0.15);
    border-radius:2px;overflow:hidden;
    opacity:0;animation: fade 0.4s ease 6.2s forwards;
  }
  .bar::after{
    content:"";display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--copper),var(--ember),var(--moss));
    animation: fill 1.2s ease 6.35s forwards;
  }
  @keyframes fill{to{width:100%}}

  .cta{
    grid-column: 1 / -1;
    align-self:end;
    margin:0 -70px;
    padding:34px 0;
    text-align:center;
    font-family:'Inter',sans-serif;font-weight:600;font-size:28px;
    color:var(--cream);
    background:linear-gradient(110deg,var(--copper) 0%,var(--ember) 50%,var(--copper) 100%);
    background-size:200% 100%;
    box-shadow: inset 0 0 30px rgba(232,155,106,0.45), 0 -12px 40px rgba(201,120,68,0.25);
    opacity:0;transform:translateY(30px);
    animation: slideUp 0.7s ease 6.6s forwards, shimmer 3s linear 7.3s infinite;
  }
  @keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    .haze,.brand,.stats,.bar,.cta,.tagline .w,.draw,.fillIn,.key,.pill{opacity:1 !important;transform:none !important;stroke-dashoffset:0 !important}
    .bar::after{width:100% !important}
  }
</style>
</head>
<body>
  <div class="haze"></div>
  <div class="grain"></div>
  <div class="particles">
    <span class="c" style="left:8%;animation-duration:18s;animation-delay:0s"></span>
    <span class="m" style="left:24%;animation-duration:22s;animation-delay:3s"></span>
    <span class="c" style="left:40%;animation-duration:20s;animation-delay:6s"></span>
    <span class="m" style="left:62%;animation-duration:25s;animation-delay:1s"></span>
    <span class="c" style="left:80%;animation-duration:19s;animation-delay:8s"></span>
    <span class="m" style="left:92%;animation-duration:23s;animation-delay:4s"></span>
  </div>

  <div class="stage">
    <div class="left">
      <div class="logo-wrap">
        <svg viewBox="0 0 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path class="draw p1" d="M35 80 L100 32 L165 80 L165 167 L35 167 Z" stroke="#C97844" stroke-width="5"/>
          <g class="fillIn p2">
            <rect x="45" y="135" width="110" height="22" rx="2" fill="#E89B6A" fill-opacity="0.55"/>
            <line x1="45" y1="135" x2="155" y2="135" stroke="#E89B6A" stroke-opacity="0.6" stroke-width="2"/>
          </g>
          <path class="draw p3" d="M70 118 Q70 82 100 82 Q130 82 130 118 Z" fill="#C97844" fill-opacity="0.85" stroke="#F2E8D8" stroke-width="5"/>
          <path class="draw p4" d="M58 118 L142 118 Q142 126 132 128 L68 128 Q58 126 58 118 Z" fill="#C97844" fill-opacity="0.85" stroke="#F2E8D8" stroke-width="5"/>
          <line class="draw p5" x1="100" y1="84" x2="100" y2="118" stroke="#F2E8D8" stroke-width="4"/>
          <path class="draw p6" d="M82 118 Q86 96 100 88" stroke="#F2E8D8" stroke-width="2.5" stroke-opacity="0.65"/>
          <path class="draw p7" d="M118 118 Q114 96 100 88" stroke="#84A07C" stroke-width="3" stroke-opacity="0.85"/>
          <g class="key">
            <circle cx="138" cy="132" r="5" stroke="#D4AF37" stroke-width="3" fill="none"/>
            <line x1="142" y1="133" x2="155" y2="133" stroke="#D4AF37" stroke-width="3"/>
            <line x1="152" y1="133" x2="152" y2="138" stroke="#D4AF37" stroke-width="3"/>
          </g>
        </svg>
      </div>
      <div class="brand">basement + garden suites</div>
    </div>

    <div class="right">
      <div class="tagline">
        <span class="w w1"><em class="c">Two</em></span> <span class="w w2"><em class="c">homes.</em></span><br>
        <span class="w w3"><em class="m">One</em></span> <span class="w w4"><em class="m">lot.</em></span>
      </div>
      <div class="stats">
        <div class="stat s1"><div class="num">147</div><div class="lbl">Suites</div></div>
        <div class="stat s2"><div class="num">$4.2M</div><div class="lbl">Rent</div></div>
        <div class="stat s3"><div class="num">24</div><div class="lbl">Wards</div></div>
        <div class="stat s4"><div class="num">4.9&#9733;</div><div class="lbl">Owners</div></div>
      </div>
      <div class="split">
        <div class="pill copper"><div class="label">Basement</div><div class="wk">14 wk</div></div>
        <div class="pill moss"><div class="label">Garden</div><div class="wk">16 wk</div></div>
      </div>
      <div class="bar"></div>
    </div>

    <div class="cta">Unlock your second income &rarr; mylegalbasement.ca</div>
  </div>
</body>
</html>
