<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1">
<title>Garden Suites by Sai — 9x16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070A07; --surface:#0E140E; --moss:#84A07C; --sage:#9DB59B;
  --olive:#D8C58A; --cream:#EFE8D8; --amber:#E9B26B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:160px 90px 140px}

/* drifting background mesh */
.mesh{position:absolute;inset:-10%;z-index:0;opacity:0;animation:fadeIn .5s ease forwards, drift 35s ease-in-out infinite alternate;
  background:
    radial-gradient(40% 30% at 20% 18%, rgba(132,160,124,.10), transparent 70%),
    radial-gradient(45% 35% at 80% 30%, rgba(157,181,155,.08), transparent 70%),
    radial-gradient(55% 40% at 30% 80%, rgba(216,197,138,.07), transparent 70%),
    radial-gradient(35% 30% at 75% 78%, rgba(132,160,124,.09), transparent 70%);
}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%)}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--moss);opacity:.18;filter:blur(1px);z-index:1}
.p1{top:14%;left:8%;animation:drift1 12s ease-in-out infinite alternate}
.p2{top:30%;left:88%;animation:drift2 14s ease-in-out infinite alternate}
.p3{top:55%;left:14%;animation:drift3 13s ease-in-out infinite alternate;background:var(--sage)}
.p4{top:72%;left:78%;animation:drift4 15s ease-in-out infinite alternate;background:var(--olive)}
.p5{top:88%;left:42%;animation:drift5 11s ease-in-out infinite alternate}

@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-2%,2%) scale(1.05)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes drift1{to{transform:translate3d(40px,30px,0)}}
@keyframes drift2{to{transform:translate3d(-50px,40px,0)}}
@keyframes drift3{to{transform:translate3d(60px,-40px,0)}}
@keyframes drift4{to{transform:translate3d(-40px,-50px,0)}}
@keyframes drift5{to{transform:translate3d(30px,-30px,0)}}

/* logo */
.logo{position:relative;width:280px;height:280px;z-index:2;margin-bottom:60px;opacity:0;animation:logoIn .4s ease .5s forwards}
@keyframes logoIn{to{opacity:1}}
.logo svg{width:100%;height:100%;overflow:visible}
.logo svg path,.logo svg line{stroke-dasharray:600;stroke-dashoffset:600}
.draw{animation:draw 900ms ease forwards}
.fadeFill{animation:fillIn 600ms ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillIn{to{fill-opacity:var(--target,.85)}}

#houseShadow{animation:draw 900ms ease .50s forwards}
#houseOutline{animation:draw 900ms ease .78s forwards}
#halo{animation:draw 900ms ease 1.06s forwards}
#hatDome{animation:draw 900ms ease 1.34s forwards}
#hatBrim{animation:draw 900ms ease 1.62s forwards}
#ridge{animation:draw 900ms ease 1.90s forwards}
#sideL{animation:draw 900ms ease 2.18s forwards}
#sideR{animation:draw 900ms ease 2.18s forwards}
#leafShape{animation:draw 900ms ease 2.18s forwards}
#leafVein{animation:draw 900ms ease 2.30s forwards}
#leafStem{animation:draw 900ms ease 2.30s forwards}
#leafShape{fill-opacity:0;--target:.85}
.leafGroup{transform-origin:138px 88px;animation:leafSway 3.2s ease-in-out 3.1s infinite}
@keyframes leafSway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.dome-fill,.brim-fill{fill-opacity:0}
#hatDome.fadeFill,#hatBrim.fadeFill{--target:.85}

/* tagline */
.tagline{position:relative;z-index:2;text-align:center;font-family:'Fraunces',serif;font-style:italic;
  font-size:clamp(60px,9vw,120px);line-height:1.02;font-weight:400;
  font-variation-settings:"opsz" 120,"SOFT" 80,"WONK" 1;color:var(--cream);max-width:920px;margin-bottom:70px;letter-spacing:-.01em}
.tagline .w{display:inline-block;opacity:0;transform:translateY(20px);animation:wordIn .55s ease forwards}
.tagline .em{color:var(--olive)}
.w1{animation-delay:2.5s}.w2{animation-delay:2.72s}.w3{animation-delay:2.94s}.w4{animation-delay:3.16s}
.w5{animation-delay:3.38s}.w6{animation-delay:3.60s}.w7{animation-delay:3.82s}
@keyframes wordIn{to{opacity:1;transform:translateY(0)}}

/* stats */
.stats{position:relative;z-index:2;display:flex;gap:48px;justify-content:center;align-items:flex-start;
  background:rgba(14,20,14,.55);border:1px solid rgba(132,160,124,.22);border-radius:18px;padding:30px 50px;
  opacity:0;transform:translateY(30px);animation:slideUp .8s cubic-bezier(.2,.7,.2,1) 3.8s forwards;margin-bottom:60px}
.stat{display:flex;flex-direction:column;align-items:center;gap:8px}
.stat .label{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.4em;text-transform:uppercase;color:var(--sage);opacity:.85}
.stat .val{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:42px;color:var(--cream);
  font-variation-settings:"opsz" 100,"SOFT" 60}
.stat .val em{color:var(--olive);font-style:italic}
.divider{width:1px;align-self:stretch;background:linear-gradient(180deg,transparent,rgba(216,197,138,.4),transparent)}
@keyframes slideUp{to{opacity:1;transform:translateY(0)}}

/* sub + timeline */
.sub{position:relative;z-index:2;font-family:'Inter',sans-serif;font-weight:400;font-size:22px;color:var(--sage);letter-spacing:.04em;
  text-align:center;opacity:0;animation:fadeUp .8s ease 5.2s forwards;margin-bottom:24px}
.timeline{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:0;width:520px;height:24px;
  opacity:0;animation:fadeUp .8s ease 5.5s forwards;margin-bottom:64px}
.timeline .bar{position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(216,197,138,.35);transform:translateY(-50%)}
.timeline .node{position:relative;width:12px;height:12px;border-radius:50%;background:var(--olive);margin:0 calc((520px - 60px)/8)}
.timeline .node:nth-child(2){animation:pulse 1.8s ease infinite}
.timeline .node:nth-child(3){animation:pulse 1.8s ease .2s infinite}
.timeline .node:nth-child(4){animation:pulse 1.8s ease .4s infinite}
.timeline .node:nth-child(5){animation:pulse 1.8s ease .6s infinite}
.timeline .node:nth-child(6){animation:pulse 1.8s ease .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(216,197,138,.5)}50%{transform:scale(1.2);box-shadow:0 0 18px 4px rgba(216,197,138,.25)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* cta */
.cta{position:relative;z-index:2;display:inline-flex;align-items:center;gap:18px;padding:30px 60px;
  background:var(--moss);color:var(--cream);font-family:'Inter',sans-serif;font-weight:500;font-size:32px;
  border-radius:999px;border:1px solid rgba(239,232,216,.18);overflow:hidden;
  opacity:0;transform:translateY(30px);animation:slideUp .8s cubic-bezier(.2,.7,.2,1) 6.5s forwards}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(233,178,107,.45) 50%,transparent 70%);
  transform:translateX(-100%);animation:shimmer 3.5s ease 7.4s infinite}
.cta .arrow{font-family:'Fraunces',serif;font-style:italic;color:var(--olive)}
.cta .url{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.15em;color:var(--cream);opacity:.9}
@keyframes shimmer{0%{transform:translateX(-100%)}60%,100%{transform:translateX(120%)}}

/* brand strip */
.brand{position:absolute;top:60px;left:0;right:0;text-align:center;z-index:2;
  font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.5em;text-transform:uppercase;color:var(--sage);opacity:0;
  animation:fadeUp .8s ease .2s forwards}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .logo svg path,.logo svg line{stroke-dashoffset:0}
  #leafShape{fill-opacity:.85}
  .dome-fill,.brim-fill{fill-opacity:.85}
  .tagline .w,.stats,.sub,.timeline,.cta,.brand{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="mesh"></div>
  <div class="vignette"></div>
  <div class="particle p1"></div><div class="particle p2"></div>
  <div class="particle p3"></div><div class="particle p4"></div>
  <div class="particle p5"></div>

  <div class="brand">Garden Suites by Sai</div>

  <div class="logo">
    <svg viewBox="0 0 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path id="houseShadow" d="M37 81.5 L100 33.5 L163 81.5 L163 168.5 L37 168.5 Z" stroke="#070A07" stroke-opacity="0.25" stroke-width="5"/>
      <path id="houseOutline" d="M35 80 L100 32 L165 80 L165 167 L35 167 Z" stroke="#84A07C" stroke-width="5"/>
      <path id="halo" d="M52 122 Q100 56 148 122" stroke="#9DB59B" stroke-width="3" stroke-opacity="0.7"/>
      <g class="leafGroup">
        <path id="leafShape" class="fadeFill" d="M128 80 Q142 64 152 70 Q150 84 134 90 Z" fill="#D8C58A" stroke="#D8C58A" stroke-width="2"/>
        <path id="leafVein" d="M134 88 Q142 78 150 72" stroke="#84A07C" stroke-width="1.8" stroke-opacity="0.7"/>
        <line id="leafStem" x1="128" y1="90" x2="132" y2="98" stroke="#D8C58A" stroke-width="2.5"/>
      </g>
      <path id="hatDome" class="dome-fill fadeFill" d="M70 118 Q70 82 100 82 Q130 82 130 118 Z" fill="#84A07C" stroke="#EFE8D8" stroke-width="5"/>
      <path id="hatBrim" class="brim-fill fadeFill" d="M58 118 L142 118 Q142 126 132 128 L68 128 Q58 126 58 118 Z" fill="#84A07C" stroke="#EFE8D8" stroke-width="5"/>
      <line id="ridge" x1="100" y1="84" x2="100" y2="118" stroke="#EFE8D8" stroke-width="4"/>
      <path id="sideL" d="M82 118 Q86 96 100 88" stroke="#EFE8D8" stroke-width="2.5" stroke-opacity="0.65"/>
      <path id="sideR" d="M118 118 Q114 96 100 88" stroke="#EFE8D8" stroke-width="2.5" stroke-opacity="0.65"/>
    </svg>
  </div>

  <h1 class="tagline">
    <span class="w w1">A</span>
    <span class="w w2">second</span>
    <span class="w w3 em"><em>life</em></span>
    <span class="w w4">for</span>
    <span class="w w5">your</span>
    <span class="w w6 em"><em>backyard.</em></span>
  </h1>

  <div class="stats">
    <div class="stat">
      <div class="label">Concept → Move-In</div>
      <div class="val"><em>16</em> weeks</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="label">Layouts permitted</div>
      <div class="val"><em>4</em> plans</div>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <div class="label">Backyard</div>
      <div class="val"><em>second life</em></div>
    </div>
  </div>

  <div class="sub">OBC compliant · CCDC contract · TARION warranty · BCIN designer</div>

  <div class="timeline">
    <div class="bar"></div>
    <div class="node"></div><div class="node"></div><div class="node"></div>
    <div class="node"></div><div class="node"></div>
  </div>

  <a class="cta" href="#">See your suite <span class="arrow">→</span> <span class="url">gardensuites.ca</span></a>
</div>
</body>
</html>
