<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Legal Basement — coming soon</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/mylegalbasement/mlb-mark.svg">
<style>
  :root{
    --bg:#0d100e; --ink:#eef0ec; --mute:#9aa39c; --line:rgba(238,240,236,.12);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Times New Roman",Georgia,serif;min-height:100vh}
  body{display:flex;flex-direction:column;justify-content:space-between;padding:48px clamp(24px,5vw,72px);position:relative;overflow-x:hidden}
  header,footer{display:flex;justify-content:space-between;align-items:center;font:500 10px/1 -apple-system,Inter,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
  header img{height:28px;width:auto;opacity:.92}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1100px;margin:auto;padding:80px 0;text-align:left}
  .eyebrow{font:500 11px/1 -apple-system,Inter,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);margin:0 0 28px}
  h1{font-family:"Times New Roman",Georgia,serif;font-weight:400;font-size:clamp(48px,9vw,124px);line-height:.95;letter-spacing:-.02em;margin:0 0 32px}
  h1 em{font-style:italic;color:var(--mute)}
  p{font:300 17px/1.55 -apple-system,Inter,sans-serif;color:var(--mute);max-width:54ch;margin:0 0 12px}
  .rule{height:1px;background:var(--line);margin:48px 0 0}
  footer{padding-top:32px;border-top:1px solid var(--line)}
</style>
</head>
<body>
  <header>
    <img src="/mylegalbasement/mlb-mark.svg" alt="My Legal Basement">
    <span>Toronto · GTA</span>
  </header>
  <main>
    <p class="eyebrow">Coming soon</p>
    <h1>My Legal Basement <em>— a new site,<br>built carefully.</em></h1>
    <p>Legal second suites and garden suites across the GTA.</p>
    <p>The site is being rebuilt. Projects, process, and team will return only when they're real and accurate.</p>
    <div class="rule"></div>
  </main>
  <footer>
    <span>My Legal Basement · Toronto</span>
    <span>Site rebuild · 2026</span>
  </footer>
</body>
</html>
